<!DOCTYPE html>

<html class="light" lang="id"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport"/>

<link rel="stylesheet" href="/dist/tailwind.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>

        body {
            background-color: #f8f9ff;
            color: #121c28;

        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .cultural-pattern-mask {
            mask-image: linear-gradient(to bottom, rgba(0,0,0,1), rgba(0,0,0,0));
            -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,1), rgba(0,0,0,0));
            opacity: 0.05;
        }
        .ammatoa-bg {
            background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M30 0l30 30-30 30L0 30 30 0zm0 10l20 20-20 20-20-20 20-20z' fill='%23003527' fill-opacity='0.1' fill-rule='evenodd'/%3E%3C/svg%3E");
        }
    </style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1/dist/umd/supabase.min.js"></script>

</head>
<body class="font-body-md text-on-background">
<a href="/"
   class="fixed top-4 left-4 md:top-6 md:left-6 z-20 inline-flex items-center gap-1.5 text-primary hover:text-on-primary-fixed-variant font-label-md text-[12px] tracking-wide transition-colors">
<span class="material-symbols-outlined text-[18px]">arrow_back</span>
    Beranda
</a>
<!-- Auth Shell Suppression: TopNavBar is typically hidden on Login/Signup screens to prioritize the canvas -->
<main class="min-h-screen flex flex-col md:flex-row">
<!-- Left Side: Cultural Visual (Split Screen) -->
<section class="hidden md:flex md:w-1/2 relative bg-primary items-center justify-center overflow-hidden">
<!-- Tope' Le'Leng Visual Overlay -->
<div class="absolute inset-0 z-0">
<div class="w-full h-full object-cover opacity-60 mix-blend-overlay" data-alt="An elegant and high-resolution close-up of a traditional Tope' Le'Leng weaving pattern from the Ammatoa Kajang culture. The fabric features intricate, repeating geometric diamond motifs in deep indigo and cream threads. The lighting is soft and cinematic, highlighting the tactile texture of the hand-woven textile. The overall aesthetic is premium and culturally rich, reflecting a blend of ancient tradition and modern educational sophistication." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuBK6KTGqIZPsvAd9LljGJNIZ6FLnyx3Zb89il6l1F6-2WJ2idHNbqEYDUdndOWTTRwUYjZ5aTrAYJxOdF1AtD78QZe9qeAB6HdGDmr_hBhS1bZ6VX7S1ev21XqXGknQen0nO7iHjn6GqAYWOEHDEmDh5VS9XcrpF0zT2sWL7faPCufW61NYl7E3GqPc_aQSF_dhMbuquzT9W2dEXZbdSsfqnDmBWQ95Dt3SoWpnaez0UrvvCPfGJ5f9-ib-talhRllHv5GC5kh7kzS3')"></div>
</div>
<!-- Subtle Animated Pattern Background -->
<div class="absolute inset-0 cultural-pattern-mask ammatoa-bg z-10"></div>

<div class="relative z-20 px-margin-desktop text-center max-w-xl">

    <h1 class="!text-white font-display-lg text-display-lg mb-stack-md leading-tight">
        Hubungkan Matematika dengan Budaya
    </h1>

    <p class="!text-white font-body-lg text-body-lg opacity-90 max-w-md mx-auto">
        Temukan harmoni antara geometri modern dan warisan leluhur Indonesia dalam perjalanan belajar yang transformatif.
    </p>

    <div class="mt-12 flex justify-center">
        <div class="h-1 w-24 bg-white rounded-full"></div>
    </div>

</div>
<!-- Decorative Branding Element -->
<div class="absolute bottom-12 left-12">
<span class="font-display-lg text-headline-sm text-on-primary tracking-tight">KANUM</span>
</div>
</section>
<!-- Right Side: Registration Form -->
<section class="flex-1 flex items-center justify-center p-gutter md:p-margin-desktop bg-surface-container-lowest">
<div class="w-full max-w-md space-y-stack-lg">
<!-- Mobile Branding -->
<div class="md:hidden text-center mb-stack-lg">
<span class="font-display-lg text-headline-md text-primary tracking-tight">KANUM</span>
</div>
<div class="space-y-2">
<h2 class="font-headline-md text-headline-md text-on-surface">Mulai Petualangan Anda</h2>
<p class="font-body-md text-body-md text-on-surface-variant">
                        Sudah punya akun? <a class="text-primary font-semibold hover:underline -mx-1 px-1 py-1 rounded" href="/login">Masuk di sini</a>
</p>
</div>
<form class="space-y-stack-md" onsubmit="return false">
<!-- Full Name -->
<div class="space-y-1">
<label class="font-label-md text-label-md text-on-surface-variant uppercase" for="name">Nama Lengkap</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline">person</span>
<input class="w-full pl-10 pr-4 py-3 bg-white border border-outline-variant rounded-lg focus:ring-2 focus:ring-primary focus:border-primary transition-all outline-none" id="name" placeholder="Budi Santoso" type="text"/>
</div>
</div>
<!-- Email Address -->
<div class="space-y-1">
<label class="font-label-md text-label-md text-on-surface-variant uppercase" for="email">Email</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline">mail</span>
<input class="w-full pl-10 pr-4 py-3 bg-white border border-outline-variant rounded-lg focus:ring-2 focus:ring-primary focus:border-primary transition-all outline-none" id="email" placeholder="nama@email.com" type="email"/>
</div>
</div>
<!-- Role Selection -->
<div class="space-y-1">
<label class="font-label-md text-label-md text-on-surface-variant uppercase">Pilihan Peran</label>
<div class="grid grid-cols-2 gap-stack-sm">
<label class="relative flex items-center justify-center p-3 border border-outline-variant rounded-lg cursor-pointer hover:bg-surface-container-low transition-colors has-[:checked]:bg-primary-fixed has-[:checked]:border-primary group">
<input checked="" class="sr-only" name="role" type="radio" value="siswa"/>
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-on-surface-variant group-has-[:checked]:text-primary">school</span>
<span class="font-body-md text-on-surface group-has-[:checked]:font-semibold">Siswa</span>
</div>
</label>
<label class="relative flex items-center justify-center p-3 border border-outline-variant rounded-lg cursor-pointer hover:bg-surface-container-low transition-colors has-[:checked]:bg-primary-fixed has-[:checked]:border-primary group">
<input class="sr-only" name="role" type="radio" value="guru"/>
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-on-surface-variant group-has-[:checked]:text-primary">co_present</span>
<span class="font-body-md text-on-surface group-has-[:checked]:font-semibold">Guru</span>
</div>
</label>
</div>
</div>
<!-- Password -->
<div class="space-y-1">
<label class="font-label-md text-label-md text-on-surface-variant uppercase" for="password">Kata Sandi</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline">lock</span>
<input class="w-full pl-10 pr-10 py-3 bg-white border border-outline-variant rounded-lg focus:ring-2 focus:ring-primary focus:border-primary transition-all outline-none" id="password" placeholder="••••••••" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-outline hover:text-on-surface transition-colors" type="button">
<span class="material-symbols-outlined" id="toggle-password-icon">visibility</span>
</button>
</div>
</div>
<!-- Confirm Password -->
<div class="space-y-1">
<label class="font-label-md text-label-md text-on-surface-variant uppercase" for="confirm-password">Konfirmasi Kata Sandi</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline">verified_user</span>
<input class="w-full pl-10 pr-4 py-3 bg-white border border-outline-variant rounded-lg focus:ring-2 focus:ring-primary focus:border-primary transition-all outline-none" id="confirm-password" placeholder="••••••••" type="password"/>
</div>
</div>
<!-- Terms checkbox -->
<div class="flex items-start gap-3 pt-2">
<input class="mt-1 rounded border-outline-variant text-primary focus:ring-primary cursor-pointer" id="terms" type="checkbox"/>
<label class="font-body-sm text-body-sm text-on-surface-variant" for="terms">
                <a class="text-primary hover:underline" href="/landing/terms" target="_blank">Syarat & Ketentuan</a> serta <a class="text-primary hover:underline" href="/landing/privacy" target="_blank">Kebijakan Privasi</a>
                        </label>
</div>
<!-- Submit Button -->
<div class="pt-4">
<button class="w-full bg-primary-container text-on-primary-container py-4 rounded-xl font-headline-sm hover:brightness-110 active:scale-[0.98] transition-all flex items-center justify-center gap-2 shadow-lg" type="button" onclick="doRegister()">
                            Daftar Sekarang
                            <span class="material-symbols-outlined">arrow_forward</span>
</button>
</div>
</form>
<!-- Cultural Divider -->
<div class="relative h-1 w-full overflow-hidden rounded-full">
<div class="ammatoa-bg h-full w-full opacity-30"></div>
</div>
<!-- Secondary Footer / Socials -->
<div class="flex items-center justify-center gap-stack-lg pt-2">
<button class="p-3 border border-outline-variant rounded-full hover:bg-surface-container-low transition-all" type="button" onclick="window.location.href='/dashboard';">
<svg class="w-6 h-6" fill="currentColor" viewbox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-1 .67-2.28 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path></svg>
</button>
<button class="p-3 border border-outline-variant rounded-full hover:bg-surface-container-low transition-all" type="button" onclick="window.location.href='/dashboard';">
<svg class="w-6 h-6 text-on-surface" fill="currentColor" viewbox="0 0 24 24"><path d="M12 2C6.477 2 2 6.477 2 12c0 4.418 2.865 8.166 6.839 9.489.5.092.682-.217.682-.482 0-.237-.008-.866-.013-1.7-2.782.603-3.369-1.341-3.369-1.341-.454-1.154-1.11-1.462-1.11-1.462-.908-.62.069-.608.069-.608 1.003.07 1.531 1.03 1.531 1.03.892 1.529 2.341 1.087 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.11-4.555-4.943 0-1.091.39-1.984 1.029-2.683-.103-.253-.446-1.27.098-2.647 0 0 .84-.269 2.75 1.025A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.294 2.747-1.025 2.747-1.025.546 1.377.203 2.394.1 2.647.64.699 1.028 1.592 1.028 2.683 0 3.842-2.339 4.687-4.566 4.935.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482C19.138 20.161 22 16.416 22 12c0-5.523-4.477-10-10-10z"></path></svg>
</button>
</div>
</div>
</section>
</main>

<p class="font-body-sm text-body-sm text-on-surface-variant opacity-60">

        </p>
</div>
